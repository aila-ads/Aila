name: CI

# Production build check only: install dependencies, generate the Prisma
# client, and run the production build. No lint, typecheck or test steps.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest

    # Placeholder values so the build does not need real secrets.
    # Nothing here connects to a real database or Supabase project.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/aila?schema=public"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Version is read from "packageManager" in package.json.
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Production build
        run: pnpm build
