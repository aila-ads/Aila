name: production-image

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    name: Build and publish production image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USER }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PAT" ]; then
            echo "::error::Missing Docker credentials. Set DOCKER_USERNAME (or DOCKER_USER) and DOCKER_PAT."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx Cloud
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ailaads/aila

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          tags: |
            ${{ vars.DOCKER_USER }}/aila:latest
            ${{ vars.DOCKER_USER }}/aila:${{ github.sha }}
          provenance: true
          sbom: true
